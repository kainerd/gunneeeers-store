services:
  - type: web
    name: gunneeeers-store
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SETUP_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: STORE_NAME
        value: Gunneeeers Store
      - key: STORE_WHATSAPP
        value: "249112780717"
      - key: STORE_EMAIL
        value: emadsesko@gmail.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
