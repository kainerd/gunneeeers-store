services:
  - type: web
    name: gunneeeers-store
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SETUP_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: STORE_NAME
        value: Gunneeeers Store
      - key: STORE_WHATSAPP
        value: "249112780717"
      - key: STORE_EMAIL
        value: emadsesko@gmail.com
      # Prefer MYSQL_URL from your MySQL addon (Railway: ${{ MySQL.MYSQL_URL }})
      - key: MYSQL_URL
        sync: false
